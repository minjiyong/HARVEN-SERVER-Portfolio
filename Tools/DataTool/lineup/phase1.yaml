    eRare:
      - {code: OakStaff,        display: 참나무 지팡이}
      - {code: KnottedStaff,    name: Knotted Staff,    display: 옹이 지팡이, kind: Staff}
      - {code: LeafStaff,       name: Leaf Staff,       display: 잎새 지팡이, kind: Staff}
    eEpic:
      - {code: EngravedStaff,   display: 각인 지팡이}
      - {code: SilverRuneStaff, name: Silver Rune Staff, display: 은각인 지팡이, kind: Staff}

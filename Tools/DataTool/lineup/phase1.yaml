# ── 방어구 · 장신구 — 등급마다 계열(단 · 성향). 계열 하나 = 투구 · 갑옷 · 장갑 · 장화 · 망토 · 목걸이 · 반지 ─────────
# 적지 않은 부위는 자동: 표시 「<계열> <부위>」 · 영문 「<en> <part_en>」 · code <code><Part>.
part_names:                   # 부위: [표시, 영문, code 꼬리]
  Helmet:   [투구, Helm, Helm]
  Armor:    [갑옷, Armor, Armor]
  Gloves:   [장갑, Gloves, Gloves]
  Boots:    [장화, Boots, Boots]
  Cloak:    [망토, Cloak, Cloak]
  Necklace: [목걸이, Amulet, Amulet]
  Ring:     [반지, Ring, Ring]
armor:
  eNone:
    - family: 여행자
      rank: 1
      tendency: 균형
      pieces:
        Helmet:   {code: LeatherHood,   display: 가죽 두건}
        Armor:    {code: PaddedArmor,   display: 누빔 갑옷}
        Gloves:   {code: LeatherGloves, display: 가죽 장갑}
        Boots:    {code: LeatherBoots,  display: 가죽 장화}
        Cloak:    {code: TravelerCloak, display: 여행자의 망토}
        Necklace: {code: BoneCharm,     display: 뼈 부적}
        Ring:     {code: CopperRing,    display: 구리 반지}
    - {family: 경비대, en: Guard, code: Guard, rank: 2, tendency: 방어}
    - {family: 개척민, en: Settler, code: Settler, rank: 3, tendency: 마법}
  eRare:
    - family: 사슬
      en: Chain
      code: Chain
      rank: 1
      tendency: 방어
      pieces:
        Helmet: {code: IronHelm,  display: 철 투구}
        Armor:  {code: ChainMail, display: 사슬 갑옷}
    - family: 각인사                 # 고급-하 추가 갑옷 한 벌(기존 — 퀘스트 보상)
      rank: 1
      tendency: 마법
      only: [Armor]
      pieces:
        Armor: {code: EngraverRobe, display: 각인사의 법복}
    - {family: 단련, en: Tempered, code: Tempered, rank: 2, tendency: 마법}
    - {family: 그락 약탈자, en: Grak Raider, code: GrakRaider, rank: 3, tendency: 균형}
  eEpic:
    - family: 사냥꾼
      en: Hunter
      code: Hunter
      rank: 1
      tendency: 균형
      pieces:
        Helmet:   {code: HunterHood,    name: Hunter Hood, display: 사냥꾼 두건}
        Armor:    {code: HunterLeather, display: 사냥꾼 가죽 갑옷}
        Gloves:   {code: IronGauntlets, display: 철 장갑}
        Boots:    {code: IronGreaves,   display: 철 장화}
        Cloak:    {code: NightCloak,    display: 야행 망토}
        Necklace: {code: SilverPendant, display: 은 목걸이}
        Ring:     {code: SilverRing,    display: 은 반지}
    - family: 기사단
      en: Order
      code: Order
      rank: 2
      tendency: 방어
      pieces:
        Helmet: {code: OrderCoif, name: Order Chain Coif, display: 기사단 사슬모}   # 「기사단 투구」는 31번(영웅) 이름
    - {family: 폐허 수비대, en: Ruin Warden, code: RuinWarden, rank: 3, tendency: 마법}

# ── 기존 영웅 · 전설 장비 — 지우지 않고 다시 매긴다(무기 직업은 weapon_class) ─────────────

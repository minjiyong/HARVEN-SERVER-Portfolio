# 경제 1차 장비 라인업 — 생성기 입력(튜닝 데이터). 계약: Shared/Document/ECONOMY.md
#
#   python3 Tools/DataTool/datatool.py lineup [--dry-run] [--seed-econ]
#
# lineup은 이 파일로 Bin/GameData/Item.json의 장비 행 · 재료 6행과 CraftRecipe.json을 다시 만든다(dt.export.write —
# manifest · _src.json · ids.lock · Gen/ItemIds.h도 함께). 소비품 · 화폐 행은 그대로 둔다(새 열은 기본값).
#  · 기존 장비는 code_name으로 찾아 id · 이름 · 아이콘 · 판매가(buy_price) · 세트를 그대로 둔다. 새 장비 id는 67부터 차례로.
#  · 등급 · 단 · 경로 · 귀속 · 단계(tier) · 착용 레벨 · 직업 · 성능 · 매입가(sell_price)는 아래 표와 공식으로 매번 다시 계산한다.
#  · 퀘스트 보상(Quest.json)이면 route에 Quest, 상점(Shop.json)이 팔면 Shop을 자동으로 더한다.
#  · Item.json의 장비가 이 파일에 없으면 멈춘다(id는 영구 — 지우지 않는다).
# --seed-econ: 아래 seed 절로 LootConst · TierLoot · EliteGear · BossLoot · Dismantle도 쓴다(시트 파일이 생기기 전 첫 값 — 그 뒤에는 시트가 원본).
#
# 등급(ItemGrade) 이름: eNone 일반 · eRare 고급 · eEpic 희귀 · eUnique 영웅 · eLegendary 전설 · eMythic 신화. 단: 1 하 · 2 중 · 3 상.

grades:                       # 등급 순서 = 곡선 배열 순서
  eNone:      {label: 일반, tier: 1, req_level: 0}
  eRare:      {label: 고급, tier: 2, req_level: 5}
  eEpic:      {label: 희귀, tier: 3, req_level: 12}
  eUnique:    {label: 영웅, tier: 4, req_level: 18}
  eLegendary: {label: 전설, tier: 5, req_level: 26}
  eMythic:    {label: 신화, tier: 5, req_level: 35}

# ── 성능 곡선 ────────────────────────────────────────────────────────────────
# 무기 공격력: 직업별 「하」 기준값(등급 순). 같은 등급 안은 하 × r^(단-1), r = sqrt(다음 등급 하 / 이 등급 하) → 상 = 다음 등급 하.
weapon_base:
  Knight:      [3, 6, 12, 22, 36, 55]
  Engraver:    [3, 8, 15, 26, 34, 44]
  NightHunter: [3, 8, 15, 25, 33, 42]
# 방어구 · 장신구: 몸통 기준 방어 지수(등급 하) — 같은 방식으로 단 보간 → 부위 배수 → 합(최소 1)을 계열 성향으로 방어 · 마방에 나눈다.
armor_base: [3, 6, 10, 15, 22, 32]
part_mult: {Helmet: 0.55, Armor: 1.0, Gloves: 0.4, Boots: 0.4, Cloak: 0.45, Necklace: 0.45, Ring: 0.35}
tendency:                     # [방어 몫, 마법 방어 몫]
  방어: [0.90, 0.10]
  마법: [0.35, 0.65]
  균형: [0.65, 0.35]
# 무기 종류 → 직업(모든 무기는 한 직업)
weapon_class: {Sword: Knight, Greatsword: Knight, Saber: Knight, Staff: Engraver, Dagger: NightHunter}

# ── 얻는 길 · 귀속 ────────────────────────────────────────────────────────────
# (등급) → [하, 중, 상]의 route. 빈 글자 = 1차 경로 없음. 퀘스트 보상이면 +Quest, 상점품이면 +Shop(자동).
routes:
  eNone:      [Field, Field|Craft, Craft]
  eRare:      [Field|Craft, Craft, Elite]
  eEpic:      [Field|Elite|Craft, Craft, Elite]
  eUnique:    [Elite|Craft, "", Boss]        # 영웅-중은 2차(불씨 레시피) 전까지 경로 없음
  eLegendary: [Boss, Boss, Boss]
  eMythic:    [Boss, Boss, Boss]
# 획득 귀속 칸: [등급, 단] — 단 0 = 그 등급 모든 단
bind_acquire: [[eUnique, 3], [eLegendary, 0], [eMythic, 0]]

# ── 제작(CraftRecipe) ─────────────────────────────────────────────────────────
# 무기 레시피(기획 G절). 방어구 = 재료 개수 · 수수료 × 0.5(올림), 장신구 = 방어구 + (희귀 이상) 같은 단계 결정 accessory_crystal_count개.
# 재료: 61 하급 사냥 정수 · 62 중급 · 63 상급 · 64 잿빛 결정 · 65 짙은 잿빛 결정 · 66 장비 파편.
craft:
  - {grade: eNone, rank: 2, fee: 100,  in: [[61, 15], [66, 2]]}
  - {grade: eNone, rank: 3, fee: 300,  in: [[61, 40], [66, 3]]}
  - {grade: eRare, rank: 1, fee: 500,  in: [[61, 60], [66, 8]]}
  - {grade: eRare, rank: 2, fee: 1200, in: [[61, 150], [64, 5], [66, 15]]}
  - {grade: eEpic, rank: 1, fee: 2000, in: [[62, 80], [64, 10], [66, 30]]}
  - {grade: eEpic, rank: 2, fee: 5000, in: [[62, 200], [64, 30], [66, 60]]}
  - {grade: eUnique, rank: 1, fee: 8000, in: [[63, 150], [65, 20], [66, 80]]}
armor_craft_ratio: 0.5
accessory_crystal: {eEpic: 64, eUnique: 65}
accessory_crystal_count: 6

# ── 매입가(sell_price) ────────────────────────────────────────────────────────
# 제작 가능품(route에 Craft · 레시피 있음) = floor(그 부위 수수료 × craft_percent ÷ 희귀도 sell_percent) — 만들어 되팔아 남지 않게(R134).
# 그 밖 = 등급 · 단 곡선(무기 기준) × 부위 배수(반올림). 상점품의 판매가(buy_price)는 그대로 — 되팔기 검사(R090)를 생성기가 먼저 본다.
sell:
  craft_percent: 50
  curve:                      # 등급: [하, 중, 상]
    eNone:      [30, 45, 70]
    eRare:      [200, 330, 520]
    eEpic:      [600, 1000, 1500]
    eUnique:    [2000, 2600, 4000]
    eLegendary: [8000, 12000, 20000]
    eMythic:    [30000, 45000, 70000]
  part_factor: {weapon: 1.0, armor: 0.5, accessory: 0.5}

# ── 아이콘(새 장비 — 그림이 생기기 전 같은 종류의 기존 아이콘) ───────────────────
icons:
  weapon:                     # 무기 종류: [일반, 고급, 희귀, 영웅, 전설, 신화]
    Sword:      [10, 11, 12, 13, 14, 14]
    Greatsword: [14, 14, 14, 14, 14, 18]
    Saber:      [16, 16, 16, 16, 16, 16]
    Staff:      [40, 42, 43, 44, 45, 45]
    Dagger:     [41, 46, 47, 48, 49, 49]
  armor:                      # 부위: [일반, 고급, 희귀, 영웅, 전설, 신화]
    Helmet:   [50, 51, 52, 68, 72, 72]
    Armor:    [53, 54, 57, 69, 73, 73]
    Gloves:   [58, 59, 59, 70, 76, 76]
    Boots:    [60, 61, 61, 71, 77, 77]
    Cloak:    [62, 63, 63, 78, 78, 78]
    Necklace: [64, 65, 65, 74, 74, 74]
    Ring:     [66, 67, 67, 75, 79, 79]

# ── 재료 6종(id 고정 · max_stack 999 · rank 0 · 경로 없음). grade는 표시 색 전용 ──────────────
materials:
  - {id: 61, code: HuntEssenceLow,  name: Low Hunt Essence,  display: 하급 사냥 정수, grade: eNone,    bind: eNone,    sell: 2,  icon: 80}
  - {id: 62, code: HuntEssenceMid,  name: Mid Hunt Essence,  display: 중급 사냥 정수, grade: eRare,    bind: eNone,    sell: 4,  icon: 81}
  - {id: 63, code: HuntEssenceHigh, name: High Hunt Essence, display: 상급 사냥 정수, grade: eEpic,    bind: eNone,    sell: 8,  icon: 82}
  - {id: 64, code: AshCrystal,      name: Ash Crystal,       display: 잿빛 결정,     grade: eEpic,    bind: eNone,    sell: 20, icon: 83}
  - {id: 65, code: DeepAshCrystal,  name: Deep Ash Crystal,  display: 짙은 잿빛 결정, grade: eUnique,  bind: eNone,    sell: 50, icon: 84}
  - {id: 66, code: GearShard,       name: Gear Shard,        display: 장비 파편,     grade: eNone,    bind: eAcquire, sell: 0,  icon: 85}
material_stack: 999

# ── 무기 — 직업 · 등급마다 [하, 중, 상] ─────────────────────────────────────────
# code만 쓰면 기존 장비(Item.json의 code_name). 새 장비는 code · name(영문 ≤ 19) · display · kind.
weapons:
  Knight:
    eNone:
      - {code: PracticeSword,  display: 연습용 목검}
      - {code: CopperSword,    name: Copper Longsword, display: 구리 장검, kind: Sword}

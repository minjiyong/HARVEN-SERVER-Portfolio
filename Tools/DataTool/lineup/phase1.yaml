  - {code: Nightfang,         display: 밤송곳니,     grade: eLegendary, rank: 3}

# ── --seed-econ: 경제 표 첫 값(ECON_SPEC §4) — 시트 파일이 생긴 뒤에는 시트가 원본 ──────────────
seed:
  LootConst:
    rare_pity: 20
    heroic_pity: 20
    class_swap_percent: 60
    level_gap: 10
    elite_permille: 20
    elite_min_tier: 2
    elite_hp_percent: 400
    elite_attack_percent: 150
    elite_level_bonus: 3
    elite_exp_percent: 300
    elite_adena_percent: 300
    elite_share_percent: 10
    boss_share_percent: 3
    shard_item: 66
    traded_dismantle_percent: 50
  TierLoot:                   # [tier, common_bp, uncommon_bp, rare_bp, essence_item, essence_permille, crystal_item, crystal_permille, elite_crystal_item, elite_crystal_count, elite_essence_count, elite_gear_percent]
    - [1, 45, 42, 0,  61, 300, 0,  0, 0,  0, 5, 0]
    - [2, 45, 30, 12, 61, 300, 64, 3, 64, 1, 5, 10]
    - [3, 45, 30, 12, 62, 250, 64, 3, 64, 1, 5, 6]
    - [4, 45, 30, 12, 63, 200, 65, 2, 65, 1, 5, 5]
    - [5, 45, 30, 12, 63, 200, 65, 2, 65, 1, 5, 5]
  EliteGear:                  # 단계: [[등급, 단, 가중치] …]
    2: [[eRare, 3, 60], [eEpic, 1, 40]]
    3: [[eEpic, 3, 50], [eEpic, 1, 30], [eUnique, 1, 20]]
    4: [[eUnique, 1, 80], [eEpic, 3, 20]]
    5: [[eUnique, 1, 80], [eEpic, 3, 20]]
  BossLoot:                   # 보스 몬스터 id: [[아이템 id(0 = 없음), 가중치] …] — 1차 임시(2차 보스 전용 무기 · 용비늘 · 균열 계열이 오면 바꾼다)
    29: [[51, 62], [52, 62], [53, 62], [54, 62], [0, 752]]                                   # 모로즈 — 이레린
    30: [[47, 62], [48, 62], [49, 62], [50, 62], [0, 752]]                                   # 우르간 — 서약
    31: [[6, 40], [47, 5], [48, 5], [49, 5], [50, 5], [51, 5], [52, 5], [53, 5], [54, 5], [55, 5], [56, 5], [57, 5], [58, 5], [0, 900]]   # 세베린

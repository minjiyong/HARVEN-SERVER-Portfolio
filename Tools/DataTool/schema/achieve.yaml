# 스키마 — 개인 업적 묶음(Achievement). 열 순서 = Canon_Achieve.h. 설계: Shared/Document/ACHIEVEMENT.md · 규칙 R136~R139(DATA_RULES.md).
# id 상한 1023(진행 기록의 달성 · 받음 비트셋 칸 — AchieveRule::kMaxId) · 이름 30 · 설명 90바이트는 구조 상수(Database/GameData/AchieveRules.h) — 코드에 남는다.
# 업적 id는 사람마다 진행 기록(UserProgress 판 4)에 저장된다 — id_lock(바꾸지 말고 deprecated로).
bundle: achieve
tabs:
  Achievement:
    source: sheet
    desc: "개인 업적 — 서버가 센 기록(kind · param)이 target에 닿으면 달성(점수는 바로, 보상은 「받기」로). 같은 group = 단계가 이어지는 연작(step 1부터)."
    key: [id]
    id_lock: true
    columns:
      - {key: id, type: u16, desc: "업적 id(1~1023, 영구 — 진행 기록의 비트 번호)", min: 1, max: 1023}
      - {key: category, type: "enum:AchCategory", desc: "분야(업적 창의 탭 — eHunt 사냥 · eBoss 보스 · eGrowth 성장 · eGear 장비 · eCraft 제작 · eWorld 세계)"}
      - {key: group, type: u16, desc: "묶음(같은 묶음 = 단계가 이어지는 연작 — 화면에서 한 줄로 이어 보인다)", min: 1}
      - {key: step, type: u8, desc: "묶음 안 단계(1부터 연속 — 같은 묶음은 같은 kind · param, 단계가 오를수록 target이 커진다)", min: 1}
      - {key: name, type: str, desc: "이름(한글 10자 이하)", nonempty: true, max_bytes: 30}
      - {key: desc, type: str, desc: "설명(한글 30자 이하)", nonempty: true, max_bytes: 90}
      - {key: kind, type: "enum:AchKind", desc: "무엇을 세는가(ACHIEVEMENT.md 1절 — 처치 · 정예 · 보스 · 파티 처치 · 레벨 · 쓰러짐 · 그로시 · 장비 · 강화 · 제작 · 분해 · 정수 · 퀘스트 · 결사 · 경매 판매 · 구매 · 교환 · 지역)"}
      - {key: param, type: u16, desc: "kind마다 뜻(0 = 아무거나) — eKill 몬스터 종 · eKillBoss 보스 종 · eGear 등급(ItemGrade 0~5, 그 등급 이상) · eQuest 퀘스트 id. 그 밖 kind는 0"}
      - {key: target, type: u32, desc: "목표(≥ 1 — eLevel은 최고 레벨 이하, eEnchant는 최고 강화 단계 이하, eZone은 들어갈 수 있는 지역 수 이하)", min: 1}
      - {key: points, type: u16, desc: "업적 점수(달성 때 바로 더한다 — 랭킹)"}
      - {key: reward_item, type: u16, desc: "보상 아이템(0 = 없음)", ref: Item, ref_zero: true}
      - {key: reward_count, type: u16, desc: "보상 개수(아이템이 있으면 1 ~ max_stack, 없으면 0)"}
      - {key: reward_adena, type: u32, desc: "보상 그로시(지갑 상한 20억 이하)", max: 2000000000}
